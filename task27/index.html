<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-step Form - Step 1</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="form-container">
    <!-- الشريط الجانبي للخطوات -->
    <aside class="sidebar">
      <div class="step-item active">
        <div class="step-number">1</div>
        <div class="step-info">
          <span class="step-title">STEP 1</span>
          <span class="step-desc">YOUR INFO</span>
        </div>
      </div>

      <div class="step-item">
        <div class="step-number">2</div>
        <div class="step-info">
          <span class="step-title">STEP 2</span>
          <span class="step-desc">SELECT PLAN</span>
        </div>
      </div>

      <div class="step-item">
        <div class="step-number">3</div>
        <div class="step-info">
          <span class="step-title">STEP 3</span>
          <span class="step-desc">ADD-ONS</span>
        </div>
      </div>

      <div class="step-item">
        <div class="step-number">4</div>
        <div class="step-info">
          <span class="step-title">STEP 4</span>
          <span class="step-desc">SUMMARY</span>
        </div>
      </div>
    </aside>

    <!-- محتوى النموذج -->
    <main class="form-content">
      <div class="form-header">
        <h1>Personal info</h1>
        <p>Please provide your name, email address, and phone number.</p>
      </div>

      <form id="infoForm">
        <div class="input-group">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="e.g. Stephen King" required />
        </div>

        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="e.g. stephenking@lorem.com" required />
        </div>

        <div class="input-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" placeholder="e.g. +1 234 567 890" required />
        </div>

        <div class="form-footer">
          <button type="submit" class="btn-next">Next Step</button>
        </div>
      </form>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
